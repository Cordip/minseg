name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: AppImage
          - os: windows-latest
            artifact: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache

      - name: Install backend deps
        working-directory: backend
        run: uv pip install -r requirements.txt --system

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: Compile backend (Nuitka)
        working-directory: backend
        run: |
          python -m nuitka \
            --onefile \
            --output-dir=dist \
            --output-filename=backend \
            --follow-import-to=aligner,segmentation,undo \
            --nofollow-import-to=pytest,setuptools,pip \
            --include-module=cv2 \
            --include-module=numpy \
            --include-module=scipy \
            --include-module=skimage \
            --include-module=fastapi \
            --include-module=uvicorn \
            --include-module=pydantic \
            --include-module=starlette \
            --include-module=anyio \
            --include-module=multipart \
            --include-module=h11 \
            --include-module=PIL \
            --include-module=websockets \
            main.py

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build frontend (Linux)
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npx electron-builder --linux AppImage

      - name: Build frontend (Windows)
        if: runner.os == 'Windows'
        working-directory: frontend
        run: npx electron-builder --win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mineral-segmentation-${{ matrix.artifact }}
          path: |
            frontend/dist/*.AppImage
            frontend/dist/*.exe
          if-no-files-found: warn
