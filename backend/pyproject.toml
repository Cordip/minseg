[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=23.2.0",
    "fastapi>=0.104.0",
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.6",
    "scikit-image>=0.22.0",
    "scipy>=1.11.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "nuitka[app]>=2.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

