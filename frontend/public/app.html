            showError('JS Error: ' + msg + ' at line ' + line);
            console.error('JS Error:', msg, url, line, col, error);
            return false;
        };
        
        // Debug logger

            console.log('[App] ' + msg);
            var debugLog = document.getElementById('debug-log');
            if (debugLog) {
                debugLog.innerHTML += new Date().toLocaleTimeString() + ' ' + msg + '<br>';
                debugLog.scrollTop = 9999;
                debugLog.classList.add('visible');
            }
        }
        
        function setStatus(msg) {
            var el = document.getElementById('loading-status');
            if (el) el.textContent = msg;
            log(msg);
        }
        
        function showError(msg) {
            var el = document.getElementById('loading-status');
            if (el) {
                el.innerHTML = '<div class="error">' + msg + '</div>';
            }
            log('ERROR: ' + msg);
        }
        
        function hideLoading() {
            var el = document.getElementById('loading-screen');
            if (el) el.style.display = 'none';
        }
        
        // Check electronAPI
        log('Page loaded');
        log('electronAPI: ' + (typeof window.electronAPI));
        log('React: ' + (typeof React));
        log('ReactDOM: ' + (typeof ReactDOM));
        
        setStatus('Проверка окружения...');
        
        if (!window.electronAPI) {
            showError('electronAPI не найден!\nПриложение должно запускаться через Electron.');
        } else {
            log('electronAPI available: ' + window.electronAPI.isAvailable);
            log('Methods: ' + Object.keys(window.electronAPI).join(', '));
        }
    </script>

                                                var rect = e.target.getBoundingClientRect();
                                                var x = Math.floor((e.clientX - rect.left) / rect.width * gridSize.cols);
                                                var y = Math.floor((e.clientY - rect.top) / rect.height * gridSize.rows);
                                                handlePatchClick(Math.max(0, Math.min(gridSize.rows - 1, y)), Math.max(0, Math.min(gridSize.cols - 1, x)));
                                            }
                                        })
                                    ) : React.createElement('div', {style: {color: '#666', textAlign: 'center', paddingTop: '40px'}}, 'Нет данных')
                                ),
                                React.createElement('div', {className: 'minimap-progress-section'},
                                    React.createElement('div', {className: 'minimap-progress-header'},
                                        React.createElement('span', {className: 'minimap-progress-title'}, 'Сегментация'),
                                        React.createElement('span', {className: 'minimap-progress-count'}, segmentationProgress.completed + ' / ' + segmentationProgress.total)
                                    ),
                                    React.createElement('div', {className: 'minimap-progress-bar'},
                                        React.createElement('div', {className: 'minimap-progress-fill', style: {width: progress + '%'}})
                                    ),
                                    isSegmenting && React.createElement('div', {className: 'minimap-progress-status'},
                                        React.createElement('span', {className: 'status-dot warning'}),
                                        'Обработка...'
                                    )
                                )
                            ),
                            
                            // Viewer
                            React.createElement('div', {className: 'viewer-panel'},
                                patchReady && currentImage ? React.createElement('div', {
                                    className: 'viewer-canvas',
                                    style: {transform: 'translate(' + offset.x + 'px, ' + offset.y + 'px) scale(' + zoom + ')', transformOrigin: '0 0'},
                                    onClick: function(e) {
                                        var rect = e.currentTarget.getBoundingClientRect();
                                        var x = Math.floor((e.clientX - rect.left - offset.x) / zoom);
                                        var y = Math.floor((e.clientY - rect.top - offset.y) / zoom);
                                        if (x >= 0 && y >= 0 && x < 1024 && y < 1024) handleImageClick(x, y);
                                    },
                                    onWheel: function(e) {
                                        e.preventDefault();
                                        var rect = e.currentTarget.getBoundingClientRect();
                                        handleWheel(e.deltaY, e.clientX - rect.left, e.clientY - rect.top);
                                    }
                                },
                                    React.createElement('img', {
                                        className: 'viewer-image',
                                        src: 'data:image/png;base64,' + displayImage,
                                        alt: 'Patch',
                                        draggable: false
                                    })
                                ) : React.createElement('div', {style: {display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', color: '#666'}}, 
                                    patchReady ? 'Загрузка...' : 'Сегментация не завершена'
                                ),
                                React.createElement('div', {className: 'info-overlay'},
                                    React.createElement('div', {className: 'info-row'},
                                        React.createElement('span', null, React.createElement('span', {className: 'label'}, 'Патч:'), ' ' + (currentPatch.y + 1) + ', ' + (currentPatch.x + 1)),
                                        React.createElement('span', null, React.createElement('span', {className: 'label'}, 'Масштаб:'), ' ' + Math.round(zoom * 100) + '%'),
                                        React.createElement('span', null, React.createElement('span', {className: 'label'}, 'Вид:'), ' ' + currentView.toUpperCase())
                                    )
                                )
                            ),
                            
                            // Tags panel
                            React.createElement('div', {className: 'tags-panel'},
                                React.createElement('div', {className: 'tags-header'},
                                    'Теги минералов',
                                    React.createElement('span', {style: {fontSize: '12px', color: '#a0a0a0'}}, Object.keys(tags).length + ' определено')
                                ),
                                React.createElement('div', {className: 'tags-list'},
                                    Object.keys(tags).length === 0 
                                        ? React.createElement('div', {style: {color: '#666', textAlign: 'center', padding: '20px'}}, 'Нет определенных тегов')
                                        : Object.entries(tags).map(function(entry) {
                                            var name = entry[0];
                                            var color = entry[1];
                                            return React.createElement('div', {key: name, className: 'tag-item'},
                                                React.createElement('span', {className: 'tag-color', style: {backgroundColor: color}}),
                                                React.createElement('span', {className: 'tag-name'}, name)
                                            );
                                        })
                                )
                            )
                        ),
                        
                        // Status bar
                        React.createElement('div', {className: 'status-bar'},
                            React.createElement('div', {className: 'status-item'},
                                React.createElement('span', {className: 'status-dot ' + (isSegmenting ? 'warning' : 'success')}),
                                isSegmenting ? 'Сегментация...' : 'Готово'
                            ),
                            React.createElement('div', {className: 'status-item'}, 'Сетка: ' + gridSize.rows + '×' + gridSize.cols + ' патчей'),
                            React.createElement('div', {className: 'status-item'}, 'Навигация: X - угол | P - PPL/XPL | S - сегменты | B - границы')
                        ),
                        
                        // Annotation modal
                        showAnnotationModal && React.createElement('div', {className: 'modal-overlay', onClick: function() { setShowAnnotationModal(false); }},
                            React.createElement('div', {className: 'modal', onClick: function(e) { e.stopPropagation(); }},
                                React.createElement('h3', {className: 'modal-header'}, 'Разметка сегмента #' + (selectedSegment ? selectedSegment.id : '')),
                                React.createElement('input', {
                                    type: 'text',
                                    className: 'modal-input',
                                    placeholder: 'Введите название минерала...',
                                    id: 'tag-input',
                                    autoFocus: true
                                }),
                                Object.keys(tags).length > 0 && React.createElement('div', {className: 'modal-suggestions'},
                                    React.createElement('p', {style: {fontSize: '12px', color: '#a0a0a0', marginBottom: '8px'}}, 'Или выберите существующий:'),
                                    Object.entries(tags).map(function(entry) {
                                        var name = entry[0];
                                        var color = entry[1];
                                        return React.createElement('div', {key: name, className: 'suggestion-item', onClick: function() { handleSelectTag(name, color); }},
                                            React.createElement('span', {className: 'suggestion-color', style: {backgroundColor: color}}),
                                            React.createElement('span', null, name)
                                        );
                                    })
                                ),
                                React.createElement('div', {className: 'modal-buttons'},
                                    React.createElement('button', {className: 'btn btn-secondary', onClick: function() { setShowAnnotationModal(false); }}, 'Отмена'),
                                    React.createElement('button', {className: 'btn btn-primary', onClick: function() {
                                        var input = document.getElementById('tag-input');
                                        if (input && input.value.trim()) handleCreateTag(input.value.trim());
                                    }}, 'Создать')
                                )
                            )
                        )
                    );
                }
                
                // Mount app
                log('Mounting React app...');
                var rootElement = document.getElementById('root');
                if (!rootElement) {
                    showError('Root element not found!');
                    return;
                }
                
                var root = ReactDOM.createRoot(rootElement);
                root.render(React.createElement(App));
                log('React app mounted successfully');
                
            } catch (error) {
                showError('Ошибка инициализации: ' + error.message + '\n' + error.stack);
            }
        }
    </script>
</body>
</html>
