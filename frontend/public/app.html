<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineral Segmentation - Editor</title>
    <link rel="stylesheet" href="../src/styles/main.css">
    <style>
        #loading-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eaeaea; z-index: 9999; }
        .viewer-panel { user-select: none; position: relative; flex: 1; background: #000; overflow: hidden; }
        .viewer-canvas { cursor: crosshair; position: absolute; transform-origin: 0 0; }
        #minimap-canvas-el { width: 100%; height: auto; border-radius: 4px; background: #000; cursor: pointer; border: 1px solid #333; }
        .toolbar-group { display: flex; align-items: center; gap: 8px; }
        .patch-counter { color: #a0a0a0; font-size: 13px; min-width: 40px; text-align: center; }
    </style>
</head>
<body>
    <div id="loading-screen"><h2>🔬 Загрузка редактора...</h2></div>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="../src/app.js"></script>
</body>
</html>
